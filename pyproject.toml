[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "cnpj-utils"
version = "0.1.0"
description = "Pipeline async para enriquecer CNPJ com CNAE e setor IBGE."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9.0",
  "aiosqlite>=0.20.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.4.2",
  "pre-commit>=3.7.0",
  "pytest>=8.2.0",
  "ruff>=0.4.4",
]

[project.scripts]
cnpj-utils = "cnpj_utils.cli:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
